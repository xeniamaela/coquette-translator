<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbol Translator</title>
<style>
  /* ---------- Theme tokens (light default, dark via prefers-color-scheme) ---------- */
  :root {
    --bg: #faf7fb;
    --panel: #ffffff;
    --text: #231f2b;
    --muted: #6d6678;
    --border: #ddd5e6;
    --accent: #8a5cf6;
    --accent-text: #ffffff;
    --chip: #f1ebf8;
    --radius: 12px;
    --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-symbols: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol",
                    "Apple Symbols", "Noto Sans Egyptian Hieroglyphs", "Noto Sans Thai",
                    "Noto Sans Arabic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15121b;
      --panel: #1f1a28;
      --text: #ece8f3;
      --muted: #a39bb3;
      --border: #3a3248;
      --accent: #a98bff;
      --accent-text: #15121b;
      --chip: #2a2336;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 var(--font-text);
  }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1rem; font-size: .95rem; }

  button {
    font: inherit; cursor: pointer; color: var(--text);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: .4rem .8rem;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .toolbar { display: flex; gap: .5rem; align-items: center; margin-bottom: .75rem; flex-wrap: wrap; }
  .mode { color: var(--muted); font-size: .9rem; }
  .mode strong { color: var(--accent); }

  /* ---------- Two panels: side by side on desktop, stacked on mobile ---------- */
  .boxes { display: flex; gap: 1rem; }
  .panel {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .75rem;
  }
  .panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .panel label { font-weight: 600; }
  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    font: 1.15rem/1.6 var(--font-symbols), var(--font-text); color: var(--text);
    background: transparent; border: 1px solid var(--border);
    border-radius: 8px; padding: .6rem;
  }
  @media (max-width: 700px) {
    .boxes { flex-direction: column; }
    textarea { min-height: 150px; }
  }

  /* ---------- Reference chart ---------- */
  .chart { margin-top: 1.5rem; }
  .chart h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: .5rem; }
  .grid button {
    display: flex; flex-direction: column; align-items: center; gap: .1rem;
    background: var(--chip); padding: .45rem .25rem;
  }
  .grid .letter { font-weight: 700; text-transform: uppercase; color: var(--muted); font-size: .8rem; }
  .grid .sym { font: 1.4rem/1.3 var(--font-symbols), var(--font-text); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: .75rem; }
</style>
</head>
<body>
<main>
  <h1>Symbol Translator</h1>
  <p class="sub">Type English or paste symbols in the same box. It detects which one you used and translates automatically.</p>

  <div class="toolbar">
    <button id="clear" type="button" class="primary">Clear</button>
    <span class="mode">Detected: <strong id="mode">English → Symbols</strong></span>
  </div>

  <div class="boxes">
    <section class="panel">
      <header>
        <label for="input">Input</label>
        <button type="button" data-copy="input">Copy</button>
      </header>
      <textarea id="input" placeholder="Type English or paste symbols here…" autocomplete="off" spellcheck="false"></textarea>
    </section>

    <section class="panel">
      <header>
        <label for="output">Output</label>
        <button type="button" data-copy="output">Copy</button>
      </header>
      <textarea id="output" placeholder="Translation appears here…" readonly></textarea>
    </section>
  </div>

  <section class="chart">
    <h2>Reference chart</h2>
    <div class="grid" id="chart"></div>
    <p class="hint">Click an item to insert it into the input box.</p>
  </section>
</main>

<script>
/* =====================================================================
   1. MAPPING: the single source of truth.
   To add characters (numbers, punctuation...), add entries here,
   e.g.  "1": "✧",  "?": "⁇".
   Keys must be a single character. Values can be any string (multi-char OK).
   The reverse map, chart and longest-match list are all generated from this.
   The " " (space) key is the symbol used for word breaks.
   ===================================================================== */
const MAP = {
  a: "♡",  b: "꩜",  c: "✮",  d: "✿",  e: "𝄞",
  f: "☘︎",  g: "♪",  h: "♛",  i: "☁︎",  j: "𐙚",
  k: "𓇼",  l: "𓏵",  m: "ʚɞ", n: "𓆝",  o: "𖤓",
  p: "ᛝ",  q: "⌗",  r: "☾",  s: "♬",  t: "⚠︎",
  u: "❀",  v: "⟡",  w: "♱",  x: "ᝰ",  y: "✶",
  z: "❤︎",
  " ": "๋࣭ ⭑"            // space symbol (contains an internal space; handled by longest-match)
};

/* =====================================================================
   2. NORMALIZATION & DERIVED DATA
   Strip variation selectors (U+FE0E text, U+FE0F emoji) so symbols match
   regardless of where they were copied from.
   ===================================================================== */
const normalize = s => s.replace(/[\uFE0E\uFE0F]/g, "");

const REVERSE = {};                                   // normalized symbol -> character
for (const [ch, sym] of Object.entries(MAP)) REVERSE[normalize(sym)] = ch;

// Longest first, so "ʚɞ" wins over any shorter symbol that is its prefix
const SYMBOLS_LONGEST_FIRST = Object.keys(REVERSE).sort((a, b) => b.length - a.length);

/* =====================================================================
   3. DIRECTION DETECTION
   If the input contains at least one known symbol, treat it as Symbols
   and decode. Otherwise treat it as English and encode.
   ===================================================================== */
function containsSymbol(text) {
  const s = normalize(text);
  return SYMBOLS_LONGEST_FIRST.some(k => s.includes(k));
}

/* =====================================================================
   4. ENCODE: English -> Symbols
   - Letters are case-insensitive. Mapped characters (including space)
     become symbols, separated from each other by a single space.
   - Everything else (line breaks, digits, punctuation) passes through.
   ===================================================================== */
function encode(text) {
  let out = "";
  let prevWasSymbol = false;
  for (const ch of text) {                            // iterates by code point
    const key = ch.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(MAP, key)) {
      out += (prevWasSymbol ? " " : "") + MAP[key];
      prevWasSymbol = true;
    } else {
      out += ch;
      prevWasSymbol = false;
    }
  }
  return out;
}

/* =====================================================================
   5. DECODE: Symbols -> English
   - Greedy longest-match against known symbols (never split by character).
   - A lone space next to a symbol is just a separator and is dropped.
     Two or more spaces in a row become one space.
   - Unknown characters pass through unchanged.
   ===================================================================== */
function decode(input) {
  const s = normalize(input);
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const sym = SYMBOLS_LONGEST_FIRST.find(k => s.startsWith(k, i));
    if (sym) { tokens.push({ t: "sym", v: REVERSE[sym] }); i += sym.length; continue; }

    const ch = String.fromCodePoint(s.codePointAt(i));
    i += ch.length;
    const last = tokens[tokens.length - 1];
    if (ch === " " || ch === "\t") {
      if (last && last.t === "sp") last.n++; else tokens.push({ t: "sp", n: 1, v: ch });
    } else tokens.push({ t: "other", v: ch });
  }

  let out = "";
  tokens.forEach((tok, idx) => {
    const prev = tokens[idx - 1], next = tokens[idx + 1];
    if (tok.t === "sym" || tok.t === "other") out += tok.v;
    else if (tok.n >= 2) out += " ";
    else if (!((prev && prev.t === "sym") || (next && next.t === "sym"))) out += tok.v;
  });
  return out;
}

/* =====================================================================
   6. UI WIRING
   Input is the only editable box, so there are no update loops.
   ===================================================================== */
const $ = id => document.getElementById(id);
const input = $("input"), output = $("output"), modeLabel = $("mode");

function update() {
  const toEnglish = containsSymbol(input.value);
  output.value = toEnglish ? decode(input.value) : encode(input.value);
  modeLabel.textContent = toEnglish ? "Symbols → English" : "English → Symbols";
}
input.addEventListener("input", update);

// Copy buttons (Clipboard API with a legacy fallback)
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const box = $(btn.dataset.copy);
    try { await navigator.clipboard.writeText(box.value); }
    catch { box.select(); document.execCommand("copy"); }
    const old = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = old), 1200);
  });
});

// Clear
$("clear").addEventListener("click", () => {
  input.value = "";
  update();
  input.focus();
});

// Reference chart: generated from MAP; click inserts that character at the caret
const chart = $("chart");
for (const [ch, sym] of Object.entries(MAP)) {
  const b = document.createElement("button");
  b.type = "button";
  b.title = ch === " " ? "Insert a space" : `Insert "${ch}"`;
  b.innerHTML = `<span class="letter"></span><span class="sym"></span>`;
  b.children[0].textContent = ch === " " ? "space" : ch;
  b.children[1].textContent = sym;
  b.addEventListener("click", () => {
    const { selectionStart: a, selectionEnd: z, value } = input;
    input.value = value.slice(0, a) + ch + value.slice(z);
    input.selectionStart = input.selectionEnd = a + ch.length;
    input.focus();
    update();
  });
  chart.appendChild(b);
}
update();
</script>
</body>
</html>
